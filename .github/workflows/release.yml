# Build ready-to-run binaries and publish them as a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Outputs attached to the release:
#   phonecast-receiver-windows-x64.exe   (MSVC, static-ish, opus built in)
#   phonecast-receiver-linux-x64         (ALSA via cpal; also confirms the
#                                         Linux build — milestone-1 item)
#   phonecast-app-debug.apk              (debug-signed: installs with the
#                                         usual "unknown source" warning; a
#                                         release keystore is TODO)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  receiver:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: phonecast-receiver-windows-x64.exe
            build: cargo build --release -p phonecast-receiver
            src: target/release/phonecast-receiver.exe
          - os: ubuntu-latest
            artifact: phonecast-receiver-linux-x64
            build: cargo build --release -p phonecast-receiver
            src: target/release/phonecast-receiver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps (ALSA headers for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake
      # Windows runners ship CMake (the opus crate builds libopus through it);
      # Rust on Windows needs no extra setup beyond the toolchain.
      - name: Build receiver
        run: ${{ matrix.build }}
      - name: Stage artifact
        run: cp "${{ matrix.src }}" "${{ matrix.artifact }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../phonecast-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phonecast-app-debug.apk
          path: phonecast-app-debug.apk

  release:
    needs: [receiver, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Windows receiver
            `phonecast-receiver-windows-x64.exe` — save it, double-click, done.
            First phone→PC connection: allow Windows Firewall's prompt (private
            networks), or run the two `netsh` commands printed at startup.

            ## Linux receiver
            `phonecast-receiver-linux-x64` — needs ALSA/PulseAudio present
            (any desktop will have it).

            ## Android sender
            `phonecast-app-debug.apk` — debug-signed, so Android will warn
            before installing ("unknown app"); that's expected for GitHub
            side-distribution. Requires Android 10+; on Android 15+ it asks
            for the microphone permission — that gates playback *capture*
            there, the mic itself is never sampled.

            Sources + docs (protocol, setup, troubleshooting): this repo.
