[package]
name = "phonecast-receiver"
version = "0.1.0"
edition = "2024"
description = "PhoneCast PC receiver: plays streamed audio to the default output device"

[dependencies]
phonecast-wire = { path = "../wire" }
# ringbuf: lock-free single-producer/single-consumer queue between the UDP
# receive thread and cpal's audio callback. Alternatives: rtrb (ringbuf is its
# maintained fork), or a Mutex<VecDeque> — ruled out because locking in the
# audio callback violates the project's realtime rules.
ringbuf = "0.4"
# cpal: cross-platform audio I/O (WASAPI shared mode on Windows, ALSA/PulseAudio on Linux).
# clap: CLI arg parsing, with derive macros for a declarative flags struct.
# anyhow: error handling in the binary (context chains); thiserror would only be needed
#   for a published library crate, which this is not yet.
# tracing + tracing-subscriber: structured logging, per project requirements.
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opus = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
mdns-sd = "0.21.7"
if-addrs = "0.15.0"
